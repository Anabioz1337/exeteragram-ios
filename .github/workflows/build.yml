name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main, extera-port, 'extera/**']
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: build-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 330

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode required by versions.json
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "Required Xcode: $XCODE_VERSION"
          if [ ! -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            echo "::notice::Xcode ${XCODE_VERSION} is not preinstalled, installing with xcodes"
            brew install xcodes
            sudo xcodes install "${XCODE_VERSION}"
          fi
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Show toolchain versions and disk space
        run: |
          sw_vers
          xcodebuild -version
          python3 --version
          df -h /

      # Make.py downloads the bazel binary pinned in versions.json itself
      # (sha256-verified), so no bazelisk here.
      # Source paths end up in the binary, so the tree is copied to a stable path.
      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Restore bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'WORKSPACE', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-
            bazel-${{ runner.os }}-

      - name: Build unsigned IPA (fake codesigning)
        working-directory: /Users/Shared/telegram-ios
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --bazelUserRoot="/private/var/tmp/_bazel_ci" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="build/artifacts" \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect artifacts
        working-directory: /Users/Shared/telegram-ios
        run: |
          ls -la build/artifacts
          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"
          cp build/artifacts/Telegram.ipa "$GITHUB_WORKSPACE/build-artifacts/exeteragram-ios-${{ github.run_number }}-unsigned.ipa"
          [ -f build/artifacts/Telegram.DSYMs.zip ] && cp build/artifacts/Telegram.DSYMs.zip "$GITHUB_WORKSPACE/build-artifacts/" || true
          df -h /

      - name: Upload unsigned ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-${{ github.run_number }}
          path: ${{ github.workspace }}/build-artifacts/*unsigned*.ipa
          if-no-files-found: error

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsyms-${{ github.run_number }}
          path: ${{ github.workspace }}/build-artifacts/*.DSYMs.zip
          if-no-files-found: ignore
